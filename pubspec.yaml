name: huike_timetable
description: 汇课：多校通用课表 App。
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.34.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.2
  yaml: ^3.1.3
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# flutter_inappwebview_android 1.1.3 使用了 AGP 9 已移除的默认 ProGuard 文件。
# 固定到项目内同版本源码，仅修正该构建配置，避免依赖本机 Pub Cache 补丁。
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

flutter:
  uses-material-design: true
  assets:
    - assets/adapters/

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/app_icon_android.png
  image_path_ios: assets/icon/app_icon_ios.png
  remove_alpha_ios: true
  adaptive_icon_background: "#C3402B"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/foreground.png
